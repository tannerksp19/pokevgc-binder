<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VGC Binder — collection &amp; trade catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════ tokens ═══════════════
   Every foreground/background pair below is measured against WCAG 2.1 AA:
   4.5:1 for body text, 3:1 for large text and for UI component boundaries. */
:root{
  color-scheme: light;

  --page:        #E8E9EE;
  --page-edge:   #DBDDE5;
  --sleeve:      #FFFFFF;
  --sleeve-2:    #F5F6F9;
  --rule:        #B9BDCA;
  --rule-soft:   #D6D9E2;

  --ink:         #14161F;
  --ink-2:       #474E60;
  --ink-3:       #5C6376;

  --accent:      #B4232F;
  --accent-deep: #8C1B24;
  --accent-wash: #F8E5E6;
  --on-accent:   #FFFFFF;

  --ok:          #16624A;
  --ok-wash:     #DEEDE7;
  --warn:        #7A580B;
  --warn-wash:   #F3EAD5;

  --foil-1: #FF9AD5;
  --foil-2: #FFD98E;
  --foil-3: #7BE8DA;
  --foil-4: #8E8AF5;

  --shadow-lo: 0 1px 2px rgba(20,22,31,.09);
  --shadow-hi: 0 6px 18px -6px rgba(20,22,31,.24);

  --display: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --body: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  --pad: 20px;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --page:        #101119;
    --page-edge:   #06070B;
    --sleeve:      #1A1C26;
    --sleeve-2:    #21242F;
    --rule:        #444A5D;
    --rule-soft:   #2E323F;
    --ink:         #EDEFF5;
    --ink-2:       #A9B0C2;
    --ink-3:       #939AB0;
    --accent:      #FF6F78;
    --accent-deep: #FF9198;
    --accent-wash: #35191D;
    --on-accent:   #1A0C0E;
    --ok:          #5CCB9C;
    --ok-wash:     #11291F;
    --warn:        #D8AC4E;
    --warn-wash:   #2A2310;
    --foil-4: #A9A6FF;
    --shadow-lo: 0 1px 2px rgba(0,0,0,.45);
    --shadow-hi: 0 8px 22px -8px rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:        #101119;
  --page-edge:   #06070B;
  --sleeve:      #1A1C26;
  --sleeve-2:    #21242F;
  --rule:        #444A5D;
  --rule-soft:   #2E323F;
  --ink:         #EDEFF5;
  --ink-2:       #A9B0C2;
  --ink-3:       #939AB0;
  --accent:      #FF6F78;
  --accent-deep: #FF9198;
  --accent-wash: #35191D;
  --on-accent:   #1A0C0E;
  --ok:          #5CCB9C;
  --ok-wash:     #11291F;
  --warn:        #D8AC4E;
  --warn-wash:   #2A2310;
  --foil-4: #A9A6FF;
  --shadow-lo: 0 1px 2px rgba(0,0,0,.45);
  --shadow-hi: 0 8px 22px -8px rgba(0,0,0,.65);
}
:root[data-theme="light"]{
  color-scheme: light;
  --page:        #E8E9EE;
  --page-edge:   #DBDDE5;
  --sleeve:      #FFFFFF;
  --sleeve-2:    #F5F6F9;
  --rule:        #B9BDCA;
  --rule-soft:   #D6D9E2;
  --ink:         #14161F;
  --ink-2:       #474E60;
  --ink-3:       #5C6376;
  --accent:      #B4232F;
  --accent-deep: #8C1B24;
  --accent-wash: #F8E5E6;
  --on-accent:   #FFFFFF;
  --ok:          #16624A;
  --ok-wash:     #DEEDE7;
  --warn:        #7A580B;
  --warn-wash:   #F3EAD5;
  --foil-4: #8E8AF5;
  --shadow-lo: 0 1px 2px rgba(20,22,31,.09);
  --shadow-hi: 0 6px 18px -6px rgba(20,22,31,.24);
}

/* ═══════════════ base ═══════════════ */
*{ box-sizing: border-box; }
html{ font-size: 100%; }           /* respects the reader's own font-size setting */
body{
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: var(--body);
  font-size: 0.9375rem;            /* 15px at default */
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3{
  font-family: var(--display);
  font-variation-settings: 'wdth' 112;
  font-weight: 700;
  margin: 0;
  text-wrap: balance;
  letter-spacing: -.005em;
}
button{ font: inherit; color: inherit; cursor: pointer; }
input,select,textarea{ font: inherit; color: inherit; }
img{ max-width: 100%; }

.mono{ font-family: var(--mono); font-variant-numeric: tabular-nums; }

.eyebrow{
  font-family: var(--mono);
  font-size: 0.6875rem;            /* 11px floor for all micro-type */
  font-weight: 500;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-3);
}

/* focus ring: 3:1 against every ground it lands on, and never clipped */
:focus-visible{
  outline: 3px solid var(--accent);
  outline-offset: 2px;
  border-radius: 2px;
}
.sr-only{
  position: absolute !important;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}
.skip{
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 200;
  background: var(--accent);
  color: var(--on-accent);
  padding: 12px 18px;
  border-radius: 0 0 3px 0;
  font-weight: 600;
  text-decoration: none;
}
.skip:focus{ left: 0; }

/* ═══════════════ shell ═══════════════ */
.sheet{
  max-width: 1220px;
  margin: 0 auto;
  padding: 22px var(--pad) 80px;
}

.masthead{
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
  padding-bottom: 14px;
  border-bottom: 2px solid var(--ink);
}
.wordmark{ display: flex; align-items: center; gap: 12px; }
.seal{ flex: none; width: 34px; height: 34px; display: block; }
.wordmark h1{ font-size: 1.625rem; line-height: 1.05; }
.wordmark .strap{
  font-family: var(--mono);
  font-size: 0.6875rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-top: 3px;
}

.deskbar{ display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.whoami{ display: flex; flex-direction: column; gap: 2px; }
.whoami .who{ font-weight: 600; font-size: 0.875rem; }
.deskbar .sep{
  width: 1px;
  align-self: stretch;
  background: var(--rule);
  margin: 0 2px;
}

/* ═══════════════ controls ═══════════════ */
.btn{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--sleeve);
  border: 1px solid var(--rule);
  border-radius: 3px;
  padding: 8px 13px;
  font-size: 0.8125rem;
  font-weight: 600;
  box-shadow: var(--shadow-lo);
  transition: background .12s, border-color .12s, color .12s;
}
.btn:hover{ background: var(--sleeve-2); border-color: var(--ink-3); }
.btn--go{
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-accent);
}
.btn--go:hover{ background: var(--accent-deep); border-color: var(--accent-deep); }
.btn--quiet{ background: transparent; box-shadow: none; color: var(--ink-2); }
.btn--quiet:hover{ background: var(--sleeve); color: var(--ink); }
.btn--peril{ background: transparent; box-shadow: none; border-color: var(--rule); color: var(--ink-2); }
.btn--peril:hover{ background: var(--accent-wash); border-color: var(--accent); color: var(--accent); }
.btn--sm{ padding: 5px 10px; font-size: 0.75rem; }
.btn:disabled{ opacity: .55; cursor: not-allowed; }

.txt{
  background: var(--sleeve);
  border: 1px solid var(--rule);
  border-radius: 3px;
  padding: 8px 10px;
  font-size: 0.8125rem;
  width: 100%;
}
.txt:hover{ border-color: var(--ink-3); }
.txt[aria-invalid="true"]{ border-color: var(--accent); border-width: 2px; }

/* ═══════════════ auth gate ═══════════════ */
.gate{
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.gate-card{
  width: 100%;
  max-width: 390px;
  background: var(--sleeve);
  border: 1px solid var(--rule);
  border-top: 4px solid var(--accent);
  border-radius: 3px;
  box-shadow: var(--shadow-hi);
  padding: 26px 24px 24px;
}
.gate-brand{ display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.gate-brand h1{ font-size: 1.375rem; }
.gate-sub{
  font-family: var(--mono);
  font-size: 0.6875rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 0 0 18px;
}
.gate-toggle{
  display: flex;
  border: 1px solid var(--rule);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 18px;
  box-shadow: var(--shadow-lo);
}
.gate-toggle button{
  flex: 1;
  background: var(--sleeve);
  border: 0;
  padding: 9px 12px;
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--ink-2);
}
.gate-toggle button + button{ border-left: 1px solid var(--rule); }
.gate-toggle button:hover{ background: var(--sleeve-2); color: var(--ink); }
.gate-toggle button[aria-pressed="true"]{ background: var(--ink); color: var(--page); }
.gate-note{
  font-size: 0.75rem;
  color: var(--ink-2);
  margin: 14px 0 0;
  line-height: 1.5;
}
.gate-note code{
  font-family: var(--mono);
  font-size: 0.6875rem;
  background: var(--sleeve-2);
  border: 1px solid var(--rule-soft);
  border-radius: 2px;
  padding: 1px 4px;
}

/* ═══════════════ tabs ═══════════════ */
.tabs{
  display: flex;
  gap: 2px;
  margin: 0 0 22px;
  border-bottom: 1px solid var(--rule);
}
.tab{
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  padding: 11px 15px;
  font-family: var(--display);
  font-variation-settings: 'wdth' 108;
  font-weight: 600;
  font-size: 0.9375rem;
  letter-spacing: .01em;
  color: var(--ink-2);
  transition: color .12s;
}
.tab:hover{ color: var(--ink); }
.tab[aria-selected="true"]{ color: var(--ink); border-bottom-color: var(--accent); }
.tab .tally{
  font-family: var(--mono);
  font-size: 0.6875rem;
  color: var(--ink-3);
  margin-left: 6px;
  font-variant-numeric: tabular-nums;
}
.tab[aria-selected="true"] .tally{ color: var(--accent); }

/* ═══════════════ ledger strip ═══════════════ */
.ledger{
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(126px, 1fr));
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  border-radius: 3px;
  overflow: hidden;
  margin: 0 0 18px;
  padding: 0;
  list-style: none;
}
.ledger-cell{ background: var(--sleeve); padding: 12px 14px; }
.ledger-cell .fig{
  font-family: var(--display);
  font-variation-settings: 'wdth' 118;
  font-weight: 700;
  font-size: 1.5rem;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
  display: block;
}
.ledger-cell.is-lit .fig{ color: var(--accent); }

/* ═══════════════ filter rack ═══════════════ */
.rack{
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-bottom: 16px;
}
.rack .txt{ width: auto; }
.rack .stretch{ flex: 1 1 200px; min-width: 150px; }
.toggle{
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: var(--sleeve);
  border: 1px solid var(--rule);
  border-radius: 3px;
  padding: 7px 11px 7px 9px;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--ink-2);
  cursor: pointer;
  box-shadow: var(--shadow-lo);
}
.toggle:hover{ border-color: var(--ink-3); }
.toggle input{ accent-color: var(--accent); margin: 0; width: 16px; height: 16px; }
.toggle:has(input:checked){ color: var(--ink); border-color: var(--ink-3); }

.count-note{
  font-family: var(--mono);
  font-size: 0.6875rem;
  color: var(--ink-3);
  margin: 0 0 12px;
  font-variant-numeric: tabular-nums;
}

/* ═══════════════ pocket grid ═══════════════ */
.pockets{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(184px, 1fr));
  gap: 14px;
  list-style: none;
  margin: 0;
  padding: 0;
}
/* stretch each card to its row so the action bars line up across the grid */
.pockets > li{ display: flex; }
.pockets > li > .pocket{ flex: 1; }
.pocket{
  background: var(--sleeve);
  border: 1px solid var(--rule);
  border-radius: 3px;
  box-shadow: var(--shadow-lo);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: box-shadow .15s, border-color .15s, transform .15s;
}
.pocket:hover{ border-color: var(--ink-3); box-shadow: var(--shadow-hi); transform: translateY(-2px); }
.pocket.is-foil{ border-color: var(--foil-4); box-shadow: 0 0 0 1px var(--foil-4), var(--shadow-lo); }
.pocket.is-foil:hover{ box-shadow: 0 0 0 1px var(--foil-1), var(--shadow-hi); }

.pocket-window{
  position: relative;
  height: 112px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg, var(--sleeve-2), var(--sleeve));
  border-bottom: 1px solid var(--rule-soft);
}
.pocket.is-foil .pocket-window::before{
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(115deg,
    color-mix(in srgb, var(--foil-1) 22%, transparent) 0%,
    transparent 32%,
    color-mix(in srgb, var(--foil-2) 20%, transparent) 48%,
    transparent 62%,
    color-mix(in srgb, var(--foil-3) 24%, transparent) 82%,
    transparent 100%);
  pointer-events: none;
}
.pocket-window img{
  width: 88px; height: 88px;
  image-rendering: pixelated;
  position: relative;
  filter: drop-shadow(0 2px 3px rgba(0,0,0,.22));
}
.no-art{
  font-family: var(--display);
  font-variation-settings: 'wdth' 118;
  font-weight: 800;
  font-size: 1.875rem;
  color: var(--ink-3);
  text-transform: uppercase;
}
.foil-flag{
  position: absolute;
  top: 6px; left: 6px;
  font-family: var(--mono);
  font-size: 0.6875rem;
  font-weight: 700;
  letter-spacing: .08em;
  padding: 3px 6px;
  border-radius: 2px;
  /* the foil gradient stays bright in both themes, so this ink is fixed dark by design */
  color: #17121C;
  background: linear-gradient(100deg, var(--foil-1), var(--foil-2), var(--foil-3));
}
/* decorative reinforcement only — the Tera type is always also written out as a tag */
.tera-gem{
  position: absolute;
  top: 7px; right: 7px;
  width: 16px; height: 16px;
  background: var(--gem, var(--ink-3));
  clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
  box-shadow: inset 0 -4px 6px rgba(0,0,0,.32), inset 0 3px 4px rgba(255,255,255,.5);
}
.tera-gem.is-stellar{
  background: conic-gradient(from 200deg, #FFD98E, #7BE8DA, #A9A6FF, #FF9AD5, #FFD98E);
}
.gem-dot{
  width: 9px; height: 9px;
  flex: none;
  background: var(--gem, var(--ink-3));
  clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
}
.gem-dot.is-stellar{ background: conic-gradient(from 200deg, #FFD98E, #7BE8DA, #A9A6FF, #FF9AD5, #FFD98E); }

.pocket-label{ padding: 10px 11px 11px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.p-name{
  font-family: var(--display);
  font-variation-settings: 'wdth' 106;
  font-weight: 700;
  font-size: 0.9375rem;
  line-height: 1.2;
  text-transform: capitalize;
  word-break: break-word;
}
.p-cat{
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
  text-transform: capitalize;
  margin: 0;
}
.p-tags{ display: flex; flex-wrap: wrap; gap: 4px; margin: auto 0 0; padding: 4px 0 0; list-style: none; }
.tag{
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--mono);
  font-size: 0.6875rem;
  letter-spacing: .02em;
  padding: 2px 6px;
  border-radius: 2px;
  border: 1px solid var(--rule);
  color: var(--ink-2);
  background: var(--sleeve-2);
  white-space: nowrap;
}
.tag--mark{ color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, transparent); background: var(--warn-wash); }
.tag--ribbon{ color: var(--ok); border-color: color-mix(in srgb, var(--ok) 50%, transparent); background: var(--ok-wash); }

.pocket-tools{ display: flex; border-top: 1px solid var(--rule-soft); }
.pocket-tools button{
  flex: 1;
  background: none;
  border: 0;
  padding: 8px 4px;
  font-family: var(--mono);
  font-size: 0.6875rem;
  font-weight: 500;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink-2);
  transition: background .12s, color .12s;
}
.pocket-tools button:hover{ background: var(--sleeve-2); color: var(--ink); }
.pocket-tools button.peril:hover{ background: var(--accent-wash); color: var(--accent); }
.pocket-tools button + button{ border-left: 1px solid var(--rule-soft); }

/* ═══════════════ empty ═══════════════ */
.blank{
  border: 1px dashed var(--rule);
  border-radius: 3px;
  padding: 52px 24px;
  text-align: center;
  background: color-mix(in srgb, var(--sleeve) 45%, transparent);
}
.blank h3{ font-size: 1.125rem; margin-bottom: 6px; }
.blank p{ margin: 0 auto; max-width: 44ch; color: var(--ink-2); font-size: 0.875rem; }
.blank .btn{ margin-top: 14px; }

/* ═══════════════ binders ═══════════════ */
.binder-rack{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 14px;
  list-style: none;
  margin: 0;
  padding: 0;
}
.binder{
  position: relative;
  background: var(--sleeve);
  border: 1px solid var(--rule);
  border-left: 5px solid var(--ink-2);
  border-radius: 3px;
  padding: 15px 16px 13px;
  box-shadow: var(--shadow-lo);
  display: flex;
  flex-direction: column;
  gap: 7px;
  transition: box-shadow .15s, transform .15s, border-left-color .15s;
}
.binder:hover{ box-shadow: var(--shadow-hi); transform: translateY(-2px); }
.binder:has(.binder-link:focus-visible){ outline: 3px solid var(--accent); outline-offset: 2px; }
.binder.is-open{ border-left-color: var(--accent); }
.binder h3{ font-size: 1.0625rem; }
/* the whole card is the hit area, but only the link is in the tab order */
.binder-link{
  background: none; border: 0; padding: 0;
  font: inherit; color: inherit; text-align: left;
}
.binder-link::after{ content: ""; position: absolute; inset: 0; }
.binder-link:focus-visible{ outline: none; }
.binder .b-note{ font-size: 0.8125rem; color: var(--ink-2); min-height: 20px; margin: 0; }
.binder .b-foot{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 3px;
  padding-top: 9px;
  border-top: 1px solid var(--rule-soft);
}
.binder .b-count{ font-family: var(--mono); font-size: 0.6875rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }

.stamp{
  font-family: var(--mono);
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 3px 7px;
  border-radius: 2px;
  border: 1px solid;
}
.stamp--open{ color: var(--ok); border-color: color-mix(in srgb, var(--ok) 55%, transparent); background: var(--ok-wash); }
.stamp--shut{ color: var(--ink-2); border-color: var(--rule); background: var(--sleeve-2); }

.plate-head{
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  padding-bottom: 14px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--rule);
}
.plate-head h2{ font-size: 1.375rem; }

/* ═══════════════ trade ═══════════════ */

/* ═══════════════ dialog ═══════════════ */
.scrim{
  position: fixed; inset: 0; z-index: 60;

@keyframes fade{ from{ opacity: 0; } }

.summary-list{

/* ═══════════════ announcements ═══════════════ */
.crier{
  position: fixed; z-index: 90;
  bottom: 22px; left: 50%;
  transform: translate(-50%, 12px);

  color: var(--page);

}
.crier.is-up{ opacity: 1; transform: translate(-50%, 0); }

/* ═══════════════ responsive ═══════════════ */
@media (max-width: 760px){
  .post{ grid-template-columns: 1fr; }

  .pockets{ grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); }

  *, *::before, *::after{ animation-duration: .01ms !important; transition-duration: .01ms !important; }
  .pocket:hover, .binder:hover{ transform: none; }

@media (prefers-contrast: more){
  :root{ --rule: var(--ink-2); --ink-3: var(--ink-2); }
  .btn, .txt, .pocket, .binder, .trader, .wire{ border-width: 2px; }
}
@media (forced-colors: active){
  .pocket, .binder, .btn, .txt, .card{ border: 1px solid CanvasText; }
  .tera-gem, .gem-dot{ forced-color-adjust: none; }
  .tab[aria-selected="true"]{ border-bottom-color: Highlight; }
}

<body>

<div id="gateRoot"></div>

<div class="sheet" id="appRoot" hidden>
  <a class="skip" href="#stage">Skip to main content</a>
  <header class="masthead">
    <div class="wordmark">
      <svg class="seal" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
        <circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="2"></circle>
        <path d="M2 20 H38" stroke="currentColor" stroke-width="2"></path>
        <circle cx="20" cy="20" r="6.5" fill="var(--page)" stroke="currentColor" stroke-width="2"></circle>
        <circle cx="20" cy="20" r="2.5" fill="var(--accent)"></circle>
      </svg>
      <div>
        <h1>VGC Binder</h1>
        <p class="strap">Collection &amp; trade catalogue</p>
      </div>
    </div>
    <div class="deskbar" id="deskbar"></div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Catalogue sections"></nav>
  <main id="stage" tabindex="-1"></main>
</div>

<div id="dialogRoot"></div>
<div class="crier" id="crier" role="status" aria-live="polite"></div>
<div class="sr-only" id="alertRegion" role="alert" aria-live="assertive"></div>
<!-- display:none keeps this out of the accessibility tree entirely; the visible
     Import button is the only control, and .click() still opens the picker -->
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
"use strict";

/* ══════════════════════ config ══════════════════════ */
const API_BASE = "http://127.0.0.1:8000";
const NS = "vgcbinder:";

/* ══════════════════════ small utils ══════════════════════ */
function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, (c) => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}
function safeUrl(v){
  const s = String(v ?? "");
  return /^https:\/\//i.test(s) ? esc(s) : "";
}
function plural(n, one, many){ return n === 1 ? one : many; }

/* polite: routine confirmations. assertive: errors the reader must not miss. */
function cry(msg){
  const el = document.getElementById("crier");
  el.classList.remove("is-bad");
  el.textContent = msg;
  el.classList.add("is-up");
  clearTimeout(cry._t);
  cry._t = setTimeout(() => el.classList.remove("is-up"), 3200);
}
function alarm(msg){
  const el = document.getElementById("crier");
  el.classList.add("is-bad");
  el.textContent = msg;
  el.classList.add("is-up");
  document.getElementById("alertRegion").textContent = msg;
  clearTimeout(cry._t);
  cry._t = setTimeout(() => {
    el.classList.remove("is-up");
    document.getElementById("alertRegion").textContent = "";
  }, 6000);
}

/* ══════════════════════ API layer ══════════════════════ */
class ApiError extends Error {
  constructor(status, message){ super(message); this.status = status; }
}

function detailToText(data, fallback){
  const d = data && data.detail;
  if (typeof d === "string") return d;
  if (Array.isArray(d)){
    return d.map(e => {
      const field = e.loc && e.loc.length ? e.loc[e.loc.length - 1] : "";
      return (field ? field + ": " : "") + e.msg;
    }).join(" · ");
  }
  return fallback || "Something went wrong";
}

let accessToken = null;   // memory only — never persisted
let me = null;            // the signed-in account

function storedRefresh(){ return localStorage.getItem(NS + "refresh"); }
function storeRefresh(t){ localStorage.setItem(NS + "refresh", t); }
function clearRefresh(){ localStorage.removeItem(NS + "refresh"); }

async function tryRefresh(){
  const rt = storedRefresh();
  if (!rt) return false;
  try{
    const res = await fetch(API_BASE + "/auth/refresh", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: rt })
    });
    if (!res.ok){ clearRefresh(); return false; }
    accessToken = (await res.json()).access_token;
    return true;
  }catch(err){
    return false;   // network problem — keep the refresh token for later
  }
}

async function api(path, { method = "GET", body, retry = true } = {}){
  let res;
  try{
    res = await fetch(API_BASE + path, {
      method,
      headers: {
        ...(body !== undefined ? { "Content-Type": "application/json" } : {}),
        ...(accessToken ? { "Authorization": "Bearer " + accessToken } : {})
      },
      body: body !== undefined ? JSON.stringify(body) : undefined
    });
  }catch(err){
    throw new ApiError(0, "Can't reach the server at " + API_BASE);
  }

  // Expired access token: refresh once, replay once.
  if (res.status === 401 && retry && storedRefresh()){
    if (await tryRefresh()){
      return api(path, { method, body, retry: false });
    }
    signOutLocally();
    throw new ApiError(401, "Session expired — sign in again");
  }

  if (res.status === 204) return null;
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new ApiError(res.status, detailToText(data));
  return data;
}

/* ══════════════════════ reference data ══════════════════════ */
const ORIGIN_GAMES = [
  "Scarlet","Violet","Sword","Shield","Brilliant Diamond","Shining Pearl",
  "Legends: Arceus","Legends: Z-A","Sun","Moon","Ultra Sun","Ultra Moon",
  "Let's Go Pikachu","Let's Go Eevee","HOME / transferred","Other"
];
const MARKS = [
  "None","Rowdy Mark","Sturdy Mark","Rare Mark","Uncommon Mark","Alpha Mark",
  "Titan Mark","Jumbo Mark","Mini Mark","Gourmand Mark","Curious Mark",
  "Absent-Minded Mark","Fidgety Mark","Rampaging Mark","Partner Mark","Other"
];
const TERA = {
  "Normal":"#9FA19F","Fire":"#E62829","Water":"#2980EF","Electric":"#FAC000",
  "Grass":"#3FA129","Ice":"#3FD8FF","Fighting":"#FF8000","Poison":"#9141CB",
  "Ground":"#915121","Flying":"#81B9EF","Psychic":"#EF4179","Bug":"#91A119",
  "Rock":"#AFA981","Ghost":"#704170","Dragon":"#5060E1","Dark":"#624D4E",
  "Steel":"#60A1B8","Fairy":"#EF70EF","Stellar":"#7B9EA8"
};
const TERA_NAMES = Object.keys(TERA);

/* ══════════════════════ state ══════════════════════ */
const app = {
  tab: "collection",
  roster: [],            // last-fetched /pokemon
  binders: [],           // last-fetched /binders
  openBinderId: null,
  tradeView: "browse",
  wireWith: null,        // peer account id
  draftClip: null,
  filters: { q: "", shinyOnly: false, origin: "", mark: "" }
};
let paintSeq = 0;        // stale async renders bail out against this

function labelFor(p){ return p.nickname || p.species; }

/* ══════════════════════ PokeAPI (sprites — client-side, cached) ══════════════════════ */
function readCache(key, fallback){
  try{ const raw = localStorage.getItem(NS + key); return raw ? JSON.parse(raw) : fallback; }
  catch(err){ return fallback; }
}
function writeCache(key, val){
  try{ localStorage.setItem(NS + key, JSON.stringify(val)); }catch(err){ /* cache only */ }
}

const speciesMemo = readCache("species-memo", {});
let speciesIndex = readCache("species-index", null);
let apiReachable = true;

async function lookupSpecies(raw){
  const slug = String(raw).trim().toLowerCase().replace(/[\s_]+/g, "-");
  if (!slug) return null;
  if (speciesMemo[slug]) return speciesMemo[slug];
  try{
    const res = await fetch("https://pokeapi.co/api/v2/pokemon/" + encodeURIComponent(slug));
    apiReachable = true;
    if (!res.ok) return null;
    const data = await res.json();
    const info = {
      dexId: data.id,
      name: data.name,
      art: data.sprites?.front_default || null,
      artShiny: data.sprites?.front_shiny || data.sprites?.front_default || null
    };
    speciesMemo[slug] = info;
    writeCache("species-memo", speciesMemo);
    return info;
  }catch(err){
    apiReachable = false;
    return null;
  }
}

async function ensureSpeciesIndex(){
  if (Array.isArray(speciesIndex) && speciesIndex.length) return;
  try{
    const res = await fetch("https://pokeapi.co/api/v2/pokemon?limit=1400");
    if (!res.ok) return;
    const data = await res.json();
    speciesIndex = (data.results || []).map(r => r.name);
    writeCache("species-index", speciesIndex);
    refreshSpeciesDatalist();
  }catch(err){ apiReachable = false; }
}

function refreshSpeciesDatalist(){
  const list = document.getElementById("speciesIndex");
  if (!list || !Array.isArray(speciesIndex)) return;
  list.innerHTML = speciesIndex.map(n => `<option value="${esc(n)}"></option>`).join("");
}

/* ══════════════════════ auth gate ══════════════════════ */
let gateMode = "login";

function enterGate(message){
  me = null;
  accessToken = null;
  document.getElementById("appRoot").hidden = true;
  const root = document.getElementById("gateRoot");
  root.innerHTML = `
    <div class="gate">
      <div class="gate-card">
        <div class="gate-brand">
          <svg class="seal" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
            <circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="2"></circle>
            <path d="M2 20 H38" stroke="currentColor" stroke-width="2"></path>
            <circle cx="20" cy="20" r="6.5" fill="var(--sleeve)" stroke="currentColor" stroke-width="2"></circle>
            <circle cx="20" cy="20" r="2.5" fill="var(--accent)"></circle>
          </svg>
          <h1>VGC Binder</h1>
        </div>
        <p class="gate-sub">Collection &amp; trade catalogue</p>
        <div class="gate-toggle">
          <button type="button" id="modeLogin" aria-pressed="${gateMode === "login"}">Sign in</button>
          <button type="button" id="modeRegister" aria-pressed="${gateMode === "register"}">Create account</button>
        </div>
        <form id="gateForm" novalidate>
          <div class="fields">
            ${gateMode === "register" ? `
              <div class="f">
                <label class="eyebrow" for="gName">Display name</label>
                <input class="txt" id="gName" type="text" autocomplete="nickname" maxlength="40" placeholder="Ash">
              </div>` : ""}
            <div class="f">
              <label class="eyebrow" for="gUser">Username</label>
              <input class="txt" id="gUser" type="text" autocomplete="username"
                     maxlength="32" spellcheck="false" aria-describedby="gUserHint">
              ${gateMode === "register" ? `<p class="f-hint" id="gUserHint">3–32 characters: letters, numbers, - and _</p>` : `<span id="gUserHint" hidden></span>`}
            </div>
            <div class="f">
              <label class="eyebrow" for="gPass">Password</label>
              <input class="txt" id="gPass" type="password"
                     autocomplete="${gateMode === "register" ? "new-password" : "current-password"}"
                     aria-describedby="gPassHint">
              ${gateMode === "register" ? `<p class="f-hint" id="gPassHint">At least 8 characters — any length works</p>` : `<span id="gPassHint" hidden></span>`}
            </div>
            <div id="gateErr"></div>
            <button class="btn btn--go" id="gateGo" type="submit" style="width:100%; justify-content:center;">
              ${gateMode === "register" ? "Create account" : "Sign in"}
            </button>
          </div>
        </form>
        <p class="gate-note">Talks to the API at <code>${esc(API_BASE)}</code>. If it isn't running:
          <code>cd vgc-backend &amp;&amp; .venv/bin/uvicorn main:app</code></p>
      </div>
    </div>
  `;

  document.getElementById("modeLogin").addEventListener("click", () => switchGateMode("login"));
  document.getElementById("modeRegister").addEventListener("click", () => switchGateMode("register"));
  document.getElementById("gateForm").addEventListener("submit", submitGate);
  const userEl = document.getElementById("gUser");
  if (enterGate._keepUser) userEl.value = enterGate._keepUser;
  (gateMode === "register" ? document.getElementById("gName") : userEl).focus();
  if (message) alarm(message);
}

function switchGateMode(mode){
  enterGate._keepUser = document.getElementById("gUser")?.value || "";
  gateMode = mode;
  enterGate();
}

function gateError(msg, fieldId){
  const slot = document.getElementById("gateErr");
  slot.innerHTML = `<p class="f-err">${esc(msg)}</p>`;
  document.getElementById("alertRegion").textContent = msg;
  if (fieldId){
    const f = document.getElementById(fieldId);
    f.setAttribute("aria-invalid", "true");
    f.focus();
  }
}

async function submitGate(e){
  e.preventDefault();
  document.getElementById("gateErr").innerHTML = "";
  ["gUser","gPass","gName"].forEach(id => document.getElementById(id)?.removeAttribute("aria-invalid"));

  const username = document.getElementById("gUser").value.trim();
  const password = document.getElementById("gPass").value;
  if (!username) return gateError("Enter your username.", "gUser");
  if (!password) return gateError("Enter your password.", "gPass");

  const btn = document.getElementById("gateGo");
  btn.disabled = true;
  btn.textContent = gateMode === "register" ? "Creating…" : "Signing in…";

  try{
    let data;
    if (gateMode === "register"){
      const display = document.getElementById("gName").value.trim();
      if (!display){
        gateError("Pick a display name — other trainers see it.", "gName");
        return;
      }
      data = await api("/auth/register", { method: "POST",
        body: { username, display_name: display, password } });
    } else {
      data = await api("/auth/login", { method: "POST",
        body: { username, password } });
    }
    accessToken = data.access_token;
    storeRefresh(data.refresh_token);
    me = data.account;
    enterApp();
    cry(`Signed in as ${me.display_name}`);
  }catch(err){
    if (err.status === 0){
      gateError(err.message + " — start it and try again.");
    } else if (err.status === 409){
      gateError("That username is taken.", "gUser");
    } else if (err.status === 401){
      gateError("Wrong username or password.", "gPass");
    } else {
      gateError(err.message);
    }
  }finally{
    btn.disabled = false;
    btn.textContent = gateMode === "register" ? "Create account" : "Sign in";
  }
}

function signOutLocally(){
  clearRefresh();
  accessToken = null;
  me = null;
  app.roster = []; app.binders = [];
  app.openBinderId = null; app.wireWith = null; app.draftClip = null;
}

async function logout(){
  const rt = storedRefresh();
  if (rt){
    try{ await api("/auth/logout", { method: "POST", body: { refresh_token: rt }, retry: false }); }
    catch(err){ /* revoking best-effort — local sign-out proceeds regardless */ }
  }
  signOutLocally();
  gateMode = "login";   // whatever the toggle was before, signing out lands on sign-in
  enterGate();
  cry("Signed out");
}

  document.getElementById("appRoot").hidden = false;
  app.tab = "collection";
  renderDeskbar();

}

const TAB_DEFS = [
  { id: "collection", label: "Collection" },
  { id: "binders", label: "Binders" },
  { id: "trade", label: "Trade" }
];

function renderTabs(){
  const nav = document.getElementById("tabs");
  const tallies = { collection: app.roster.length, binders: app.binders.length, trade: null };
  nav.setAttribute("role", "tablist");
  nav.innerHTML = TAB_DEFS.map(t => {
    const on = app.tab === t.id;
    const count = tallies[t.id];
    const named = count !== null ? `${t.label}, ${count} ${plural(count, "item", "items")}` : t.label;
    return `<button class="tab" role="tab" id="tab-${t.id}" data-tab="${t.id}"
      aria-selected="${on}" aria-controls="stage" tabindex="${on ? 0 : -1}"
      aria-label="${esc(named)}">
      <span aria-hidden="true">${t.label}${count !== null ? `<span class="tally">${count}</span>` : ""}</span>
    </button>`;
  }).join("");

  const tabs = Array.from(nav.querySelectorAll(".tab"));
  tabs.forEach((btn, i) => {
    btn.addEventListener("click", () => switchTab(btn.dataset.tab));
    btn.addEventListener("keydown", (e) => {
      const map = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 };
      if (!(e.key in map)) return;
      e.preventDefault();
      const next = tabs[(map[e.key] + tabs.length) % tabs.length];
      next.focus();
      switchTab(next.dataset.tab);
    });
  });
}

/* Update a tab's count in place — no innerHTML swap, so keyboard focus survives. */
function setTally(tabId, count){
  const btn = document.getElementById("tab-" + tabId);
  if (!btn) return;
  const def = TAB_DEFS.find(t => t.id === tabId);
  btn.setAttribute("aria-label", `${def.label}, ${count} ${plural(count, "item", "items")}`);
  let t = btn.querySelector(".tally");
  if (!t){
    t = document.createElement("span");
    t.className = "tally";
    btn.firstElementChild.appendChild(t);
  }
  t.textContent = count;
}

function switchTab(id){
  app.tab = id;
  app.openBinderId = null;
  renderTabs();
  renderStage();
  document.getElementById("tabs").querySelector(`[data-tab="${id}"]`)?.focus();
}

function renderStage(){
  const stage = document.getElementById("stage");
  stage.setAttribute("role", "tabpanel");
  stage.setAttribute("aria-labelledby", "tab-" + app.tab);
  if (app.tab === "collection") return renderCollection(stage);
  if (app.tab === "binders") return renderBinders(stage);
  return renderTrade(stage);
}

function stageFailed(stage, err){
  stage.innerHTML = `
    <div class="blank">
      <h3>Couldn't load</h3>
      <p>${esc(err.message)}</p>
      <button class="btn" id="retryBtn">Try again</button>
    </div>`;
  document.getElementById("retryBtn").addEventListener("click", renderStage);
  alarm(err.message);
}

/* ══════════════════════ collection ══════════════════════ */
async function renderCollection(stage){
  const seq = ++paintSeq;
  stage.innerHTML = `<p class="count-note">Loading collection…</p>`;
  let roster, binders;
  try{
    [roster, binders] = await Promise.all([api("/pokemon"), api("/binders")]);
  }catch(err){
    if (seq === paintSeq) stageFailed(stage, err);
    return;
  }
  if (seq !== paintSeq) return;
  app.roster = roster;
  app.binders = binders;
  setTally("collection", roster.length);
  setTally("binders", binders.length);

  const total = roster.length;
  const shiny = roster.filter(p => p.shiny).length;
  const marked = roster.filter(p => p.mark).length;
  const filed = new Set(binders.flatMap(b => b.pokemon_ids)).size;

  stage.innerHTML = `
    <h2 class="sr-only">Collection</h2>
    <ul class="ledger">
      ${[
        { n: total,  label: "Catalogued",       lit: false },
        { n: shiny,  label: "Shiny",            lit: shiny > 0 },
        { n: marked, label: "Marked",           lit: false },
        { n: filed,  label: "Filed in binders", lit: false }
      ].map(s => `
        <li class="ledger-cell${s.lit ? " is-lit" : ""}" aria-label="${s.n} ${esc(s.label.toLowerCase())}">
          <span class="fig" aria-hidden="true">${s.n}</span><span class="eyebrow" aria-hidden="true">${esc(s.label)}</span>
        </li>`).join("")}
    </ul>

    <div class="rack" role="search">
      <label class="sr-only" for="searchBox">Search species or nickname</label>
      <input type="text" class="txt stretch" id="searchBox" placeholder="Search species or nickname" value="${esc(app.filters.q)}" autocomplete="off">
      <label class="sr-only" for="originPick">Filter by origin game</label>
      <select class="txt" id="originPick">
        <option value="">Any origin</option>
        ${ORIGIN_GAMES.map(g => `<option value="${esc(g)}"${app.filters.origin === g ? " selected" : ""}>${esc(g)}</option>`).join("")}
      </select>
      <label class="sr-only" for="markPick">Filter by mark</label>
      <select class="txt" id="markPick">
        <option value="">Any mark</option>
        ${MARKS.filter(m => m !== "None").map(m => `<option value="${esc(m)}"${app.filters.mark === m ? " selected" : ""}>${esc(m)}</option>`).join("")}
      </select>
      <label class="toggle" for="shinyPick"><input type="checkbox" id="shinyPick"${app.filters.shinyOnly ? " checked" : ""}> Shiny only</label>
      <button class="btn btn--go" id="catalogueBtn">Catalogue a Pokémon</button>
    </div>

    <p class="count-note" id="countNote" role="status" aria-live="polite"></p>
    <div id="rosterOut"></div>
    <datalist id="speciesIndex"></datalist>
  `;

  document.getElementById("searchBox").addEventListener("input", (e) => { app.filters.q = e.target.value; paintRoster(); });
  document.getElementById("originPick").addEventListener("change", (e) => { app.filters.origin = e.target.value; paintRoster(); });
  document.getElementById("markPick").addEventListener("change", (e) => { app.filters.mark = e.target.value; paintRoster(); });
  document.getElementById("shinyPick").addEventListener("change", (e) => { app.filters.shinyOnly = e.target.checked; paintRoster(); });
  document.getElementById("catalogueBtn").addEventListener("click", () => openEntryDialog(null));

  refreshSpeciesDatalist();
  ensureSpeciesIndex();
  paintRoster();
}

function siftRoster(){
  const f = app.filters;
  const q = f.q.trim().toLowerCase();
  return app.roster.filter(p => {
    if (q && !(p.species.toLowerCase().includes(q) || (p.nickname || "").toLowerCase().includes(q))) return false;
    if (f.shinyOnly && !p.shiny) return false;
    if (f.origin && p.origin_game !== f.origin) return false;
    if (f.mark && p.mark !== f.mark) return false;
    return true;
  });
}

function paintRoster(){
  const out = document.getElementById("rosterOut");
  const note = document.getElementById("countNote");
  if (!out) return;
  const list = siftRoster();

  note.textContent = list.length === app.roster.length
    ? `${app.roster.length} ${plural(app.roster.length, "entry", "entries")} · ${me.display_name}`
    : `${list.length} of ${app.roster.length} shown · ${me.display_name}`;

  if (app.roster.length === 0){
    out.innerHTML = `<div class="blank"><h3>Nothing catalogued yet</h3><p>Add your first Pokémon and its provenance — origin game, ball, mark, OT — and it becomes available to file into trade binders.</p></div>`;
    return;
  }
  if (list.length === 0){
    out.innerHTML = `<div class="blank"><h3>No matches</h3><p>Nothing in this collection fits those filters. Clear one to widen the search.</p></div>`;
    return;
  }

  out.innerHTML = `<ul class="pockets">${list.map(p => `<li>${pocketHTML(p, { tools: "roster" })}</li>`).join("")}</ul>`;
  wirePocketTools(out);
}

function pocketHTML(p, opts){
  const art = p.shiny ? (p.art_shiny || p.art) : p.art;
  const artUrl = safeUrl(art);
  const name = labelFor(p);
  const headId = "pk-" + p.id;

  const tags = [];
  if (p.origin_game) tags.push(`<li class="tag">${esc(p.origin_game)}</li>`);
  if (p.mark) tags.push(`<li class="tag tag--mark">${esc(p.mark)}</li>`);
  if (p.ribbon) tags.push(`<li class="tag tag--ribbon">${esc(p.ribbon)}</li>`);
  if (p.ball) tags.push(`<li class="tag">${esc(p.ball)}</li>`);
  /* Tera type is written out, not signalled by the gem colour alone (WCAG 1.4.1) */
  if (p.tera_type){
    tags.push(`<li class="tag"><span class="gem-dot${p.tera_type === "Stellar" ? " is-stellar" : ""}" style="--gem:${esc(TERA[p.tera_type] || "#888")}" aria-hidden="true"></span>Tera ${esc(p.tera_type)}</li>`);
  }

  const catLine = p.dex_id
    ? `#${String(p.dex_id).padStart(4, "0")}${p.nickname ? " · " + esc(p.species) : ""}`
    : (p.nickname ? esc(p.species) : "Not in dex index");
  /* "#0727 · incineroar" reads badly aloud — "#" and the middot are announced
     literally or dropped, so spell the same facts out for the screen reader. */
  const catSpoken = p.dex_id
    ? `Dex ${p.dex_id}${p.nickname ? ", species " + p.species : ""}`
    : (p.nickname ? `Species ${p.species}` : "Not in dex index");

  let tools = "";
  if (opts.tools === "roster"){
    tools = `<div class="pocket-tools">
      <button type="button" data-act="edit" data-id="${p.id}" aria-label="Edit ${esc(name)}">Edit</button>
      <button type="button" class="peril" data-act="drop" data-id="${p.id}" aria-label="Remove ${esc(name)} from collection">Remove</button>
    </div>`;
  } else if (opts.tools === "binder"){
    tools = `<div class="pocket-tools">
      <button type="button" class="peril" data-act="unfile" data-id="${p.id}" aria-label="Take ${esc(name)} out of this binder">Take out</button>
    </div>`;
  }

  return `
    <article class="pocket${p.shiny ? " is-foil" : ""}" aria-labelledby="${esc(headId)}">
      <div class="pocket-window">
        ${artUrl
          ? `<img src="${artUrl}" alt="${esc(p.species)} sprite" loading="lazy">`
          : `<span class="no-art" aria-hidden="true">${esc((p.species || "?").slice(0,2))}</span>`}
        ${p.shiny ? `<span class="foil-flag">SHINY</span>` : ""}
        ${p.tera_type ? `<span class="tera-gem${p.tera_type === "Stellar" ? " is-stellar" : ""}" style="--gem:${esc(TERA[p.tera_type] || "#888")}" aria-hidden="true"></span>` : ""}
      </div>
      <div class="pocket-label">
        <h3 class="p-name" id="${esc(headId)}">${esc(name)}</h3>
        <p class="p-cat mono" aria-label="${esc(catSpoken)}"><span aria-hidden="true">${catLine}</span></p>
        <ul class="p-tags">${tags.join("")}</ul>
      </div>
      ${tools}
    </article>
  `;
}

function wirePocketTools(root){
  root.querySelectorAll("[data-act]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = Number(btn.dataset.id);
      if (btn.dataset.act === "edit"){
        openEntryDialog(app.roster.find(p => p.id === id));
      } else if (btn.dataset.act === "drop"){
        confirmDrop(id);
      } else if (btn.dataset.act === "unfile"){
        const binder = app.binders.find(b => b.id === app.openBinderId);
        const p = app.roster.find(x => x.id === id);
        if (!binder) return;
        try{
          await api(`/binders/${binder.id}/pokemon`, { method: "PUT",
            body: { pokemon_ids: binder.pokemon_ids.filter(x => x !== id) } });
        }catch(err){ alarm(err.message); return; }
        renderStage();
        cry(`${labelFor(p)} taken out of ${binder.name}`);
      }
    });
  });
}

function confirmDrop(id){
  const p = app.roster.find(x => x.id === id);
  if (!p) return;
  const inBinders = app.binders.filter(b => b.pokemon_ids.includes(id));
  askConfirm({
    title: "Remove " + labelFor(p) + "?",
    body: inBinders.length
      ? `This also takes it out of ${inBinders.length} ${plural(inBinders.length, "binder", "binders")}: ${inBinders.map(b => b.name).join(", ")}.`
      : "This deletes the entry and its provenance details.",
    go: "Remove entry",
    async onGo(){
      try{ await api(`/pokemon/${id}`, { method: "DELETE" }); }
      catch(err){ alarm(err.message); return; }
      renderStage();
      cry("Removed " + labelFor(p));
    }
  });
}

/* ══════════════════════ entry dialog ══════════════════════ */
function openEntryDialog(existing){
  const editing = Boolean(existing);
  const p = existing || {
    species: "", nickname: "", shiny: false, mark: "", ribbon: "",
    origin_game: ORIGIN_GAMES[0], tera_type: "", ball: "", level: null,
    nature: "", ability: "", ot: "", language: "", notes: "",
    dex_id: null, art: null, art_shiny: null
  };
  const markSel = p.mark || "None";

  openDialog(`
    <h2 id="dlgTitle">${editing ? "Edit entry" : "Catalogue a Pokémon"}</h2>
    <p class="card-sub" id="dlgDesc">Species is looked up against PokéAPI for the dex number and sprite. Everything else is your own record.</p>
    <div class="fields">
      <div class="pair">
        <div class="f">
          <label class="eyebrow" for="fSpecies">Species (required)</label>
          <input class="txt" id="fSpecies" type="text" list="speciesIndex" placeholder="incineroar"
                 autocomplete="off" aria-describedby="speciesHint" value="${esc(p.species)}">
          <p class="f-hint" id="speciesHint">API name — e.g. urshifu-rapid-strike</p>
        </div>
        <div class="f">
          <label class="eyebrow" for="fNick">Nickname</label>
          <input class="txt" id="fNick" type="text" placeholder="optional" maxlength="40" value="${esc(p.nickname)}">
        </div>
      </div>

      <label class="switch" for="fShiny">
        <span><span class="s-lab">Shiny</span><span class="s-sub">Gives the entry a foil sleeve in the grid</span></span>
        <input type="checkbox" id="fShiny"${p.shiny ? " checked" : ""}>
      </label>

      <div class="pair">
        <div class="f">
          <label class="eyebrow" for="fMark">Mark</label>
          <select class="txt" id="fMark">${MARKS.map(m => `<option${markSel === m ? " selected" : ""}>${esc(m)}</option>`).join("")}</select>
        </div>
        <div class="f">
          <label class="eyebrow" for="fRibbon">Ribbon or title</label>
          <input class="txt" id="fRibbon" type="text" placeholder="Regional Champion" maxlength="64" value="${esc(p.ribbon)}">
        </div>
      </div>

      <div class="pair">
        <div class="f">
          <label class="eyebrow" for="fOrigin">Origin game</label>
          <select class="txt" id="fOrigin">${ORIGIN_GAMES.map(g => `<option${p.origin_game === g ? " selected" : ""}>${esc(g)}</option>`).join("")}</select>
        </div>
        <div class="f">
          <label class="eyebrow" for="fTera">Tera type</label>
          <select class="txt" id="fTera">
            <option value="">None recorded</option>
            ${TERA_NAMES.map(t => `<option${p.tera_type === t ? " selected" : ""}>${esc(t)}</option>`).join("")}
          </select>
        </div>
      </div>

      <div class="pair">
        <div class="f">
          <label class="eyebrow" for="fBall">Ball</label>
          <input class="txt" id="fBall" type="text" placeholder="Beast Ball" maxlength="40" value="${esc(p.ball)}">
        </div>
        <div class="f">
          <label class="eyebrow" for="fLevel">Level</label>
          <input class="txt mono" id="fLevel" type="text" inputmode="numeric"
                 aria-describedby="levelHint" value="${p.level ?? ""}">
          <p class="f-hint" id="levelHint">1–100, or leave blank</p>
        </div>
      </div>

      <div class="pair">
        <div class="f">
          <label class="eyebrow" for="fNature">Nature</label>
          <input class="txt" id="fNature" type="text" placeholder="Adamant" maxlength="20" value="${esc(p.nature)}">
        </div>
        <div class="f">
          <label class="eyebrow" for="fAbility">Ability</label>
          <input class="txt" id="fAbility" type="text" placeholder="Intimidate" maxlength="40" value="${esc(p.ability)}">
        </div>
      </div>

      <div class="pair">
        <div class="f">
          <label class="eyebrow" for="fOt">Original trainer</label>
          <input class="txt" id="fOt" type="text" maxlength="40" value="${esc(p.ot)}">
        </div>
        <div class="f">
          <label class="eyebrow" for="fLang">Language</label>
          <input class="txt" id="fLang" type="text" placeholder="English" maxlength="20" value="${esc(p.language)}">
        </div>
      </div>

      <div class="f">
        <label class="eyebrow" for="fNotes">Notes</label>
        <textarea class="txt" id="fNotes" maxlength="2000" placeholder="Trade history, IV spread, anything worth remembering">${esc(p.notes)}</textarea>
      </div>
    </div>
    <div class="card-acts">
      <button class="btn btn--quiet" data-close>Cancel</button>
      <button class="btn btn--go" id="saveEntry">${editing ? "Save entry" : "Add to collection"}</button>
    </div>

  refreshSpeciesDatalist();
  document.getElementById("fSpecies").focus();

  document.getElementById("saveEntry").addEventListener("click", async () => {
    const speciesField = document.getElementById("fSpecies");
    const species = speciesField.value.trim();
    if (!species){
      showFieldError(speciesField, "speciesErr", "Enter a species name — it's the one detail every entry needs.");
      return;
    }
    clearFieldError(speciesField, "speciesErr", "speciesHint");

    const levelField = document.getElementById("fLevel");
    const levelRaw = levelField.value.trim();
    let level = null;
    if (levelRaw !== ""){
      level = parseInt(levelRaw, 10);
      if (!Number.isInteger(level) || level < 1 || level > 100){
        showFieldError(levelField, "levelErr", "Level must be a number from 1 to 100, or blank.");
        return;
      }
    }
    clearFieldError(levelField, "levelErr", "levelHint");

    const btn = document.getElementById("saveEntry");
    btn.disabled = true;
    btn.textContent = "Looking up…";

    const info = await lookupSpecies(species);
    const markVal = document.getElementById("fMark").value;
    const payload = {
      species: info ? info.name : species.toLowerCase(),
      nickname: document.getElementById("fNick").value.trim(),
      shiny: document.getElementById("fShiny").checked,
      mark: markVal === "None" ? "" : markVal,
      ribbon: document.getElementById("fRibbon").value.trim(),
      origin_game: document.getElementById("fOrigin").value,
      tera_type: document.getElementById("fTera").value,
      ball: document.getElementById("fBall").value.trim(),
      level,
      nature: document.getElementById("fNature").value.trim(),
      ability: document.getElementById("fAbility").value.trim(),
      ot: document.getElementById("fOt").value.trim(),
      language: document.getElementById("fLang").value.trim(),
      notes: document.getElementById("fNotes").value.trim(),
      dex_id: info ? info.dexId : p.dex_id,
      art: info ? info.art : p.art,
      art_shiny: info ? info.artShiny : p.art_shiny
    };

    btn.textContent = "Saving…";
    let saved;
    try{
      saved = editing
        ? await api(`/pokemon/${existing.id}`, { method: "PUT", body: payload })
        : await api("/pokemon", { method: "POST", body: payload });
    }catch(err){
      btn.disabled = false;
      btn.textContent = editing ? "Save entry" : "Add to collection";
      alarm(err.message);
      return;
    }

    closeDialog();
    renderStage();
    if (!info){
      alarm(apiReachable
        ? `Saved, but "${species}" isn't a PokéAPI name, so it has no sprite or dex number. Edit it to correct the spelling.`
        : "Saved without a sprite — PokéAPI is unreachable right now. Edit the entry later to fetch it.");
    } else {
      cry(labelFor(saved) + (editing ? " updated" : " catalogued"));
    }
  });
}

function showFieldError(field, errId, msg){
  clearFieldError(field, errId);
  field.setAttribute("aria-invalid", "true");
  const err = document.createElement("p");
  err.className = "f-err";
  err.id = errId;
  err.textContent = msg;
  field.parentElement.appendChild(err);
  field.setAttribute("aria-describedby", errId);
  document.getElementById("alertRegion").textContent = msg;
  field.focus();
}
function clearFieldError(field, errId, restoreDescribedBy){
  field.removeAttribute("aria-invalid");
  document.getElementById(errId)?.remove();
  if (restoreDescribedBy) field.setAttribute("aria-describedby", restoreDescribedBy);
  document.getElementById("alertRegion").textContent = "";
}

async function renderBinders(stage){
  const seq = ++paintSeq;
  stage.innerHTML = `<p class="count-note">Loading binders…</p>`;
  let roster, binders;
  try{
    [roster, binders] = await Promise.all([api("/pokemon"), api("/binders")]);

function renderBinderPlate(stage){
  const binder = app.binders.find(b => b.id === app.openBinderId);
  if (!binder){ app.openBinderId = null; return renderBinders(stage); }
  const held = app.roster.filter(p => binder.pokemon_ids.includes(p.id));

  stage.innerHTML = `
    <button class="backlink" id="backBinders"><span aria-hidden="true">←</span> All binders</button>
    <div class="plate-head">
      <div>
        <p class="eyebrow">Binder</p>

      </div>
    </div>
    <p class="count-note" role="status" aria-live="polite">${held.length} ${plural(held.length, "entry", "entries")} · ${binder.tradeable ? "visible to other trainers" : "private to " + esc(me.display_name)}</p>

  `;

  document.getElementById("backBinders").addEventListener("click", () => { app.openBinderId = null; renderStage(); });
  document.getElementById("tradeFlag").addEventListener("change", async (e) => {
    const on = e.target.checked;
    try{
      await api(`/binders/${binder.id}`, { method: "PUT", body: {
        name: binder.name, description: binder.description, tradeable: on
      }});
    }catch(err){ e.target.checked = !on; alarm(err.message); return; }

  document.getElementById("binBinder").addEventListener("click", () => {
    askConfirm({
      title: "Delete " + binder.name + "?",
      body: "The binder goes away. The " + held.length + " Pokémon inside stay in your collection.",
      go: "Delete binder",
      async onGo(){
        try{ await api(`/binders/${binder.id}`, { method: "DELETE" }); }
        catch(err){ alarm(err.message); return; }
        app.openBinderId = null;
        renderStage();
        cry("Binder deleted");
      }
    });

  const out = document.getElementById("plateOut");

  wirePocketTools(out);
}

function openFileInDialog(binder){
  const spare = app.roster.filter(p => !binder.pokemon_ids.includes(p.id));
  openDialog(`
    <h2 id="dlgTitle">File into ${esc(binder.name)}</h2>
    <p class="card-sub" id="dlgDesc">${spare.length ? "Pick from the rest of your collection." : "Nothing left to add."}</p>
    ${spare.length === 0
      ? `<div class="blank" style="padding:34px 18px;"><h3>Everything's already filed</h3><p>All ${app.roster.length} ${plural(app.roster.length, "entry", "entries")} in your collection are in this binder.</p></div>`
      : `<fieldset style="border:0;padding:0;margin:0;">
          <legend class="sr-only">Pokémon to file in</legend>
          <ul class="picker" id="pickBox">${spare.map(p => {
            const art = safeUrl(p.shiny ? (p.art_shiny || p.art) : p.art);
            const cid = "pick-" + p.id;
            return `<li><label class="pick" for="${cid}">
              <input type="checkbox" id="${cid}" value="${p.id}">
              ${art ? `<img src="${art}" alt="" loading="lazy">` : `<span class="no-art" style="font-size:0.9375rem;width:30px;text-align:center;" aria-hidden="true">${esc((p.species || "?").slice(0,2))}</span>`}
              <span class="pk-name">${esc(labelFor(p))}</span>
              ${p.shiny ? `<span class="tag" style="border-color:var(--foil-4);">Shiny</span>` : ""}
            </label></li>`;
          }).join("")}</ul>
        </fieldset>`}
    <div class="card-acts">
      <button class="btn btn--quiet" data-close>${spare.length ? "Cancel" : "Close"}</button>
      ${spare.length ? `<button class="btn btn--go" id="doFile">File selected</button>` : ""}

  go.addEventListener("click", async () => {

      await api(`/binders/${binder.id}/pokemon`, { method: "PUT",

/* ══════════════════════ trade ══════════════════════ */
function renderTrade(stage){
  stage.innerHTML = `
    <h2 class="sr-only">Trade</h2>
    <div class="segbar" role="tablist" aria-label="Trade views">
      <button class="seg" role="tab" id="seg-browse" data-view="browse" aria-controls="tradeOut"
        aria-selected="${app.tradeView === "browse"}" tabindex="${app.tradeView === "browse" ? 0 : -1}">Tradeable binders</button>
      <button class="seg" role="tab" id="seg-wire" data-view="wire" aria-controls="tradeOut"
        aria-selected="${app.tradeView === "wire"}" tabindex="${app.tradeView === "wire" ? 0 : -1}">Messages</button>
    </div>
    <div id="tradeOut" role="tabpanel" aria-labelledby="seg-${app.tradeView}" tabindex="-1"></div>
  `;
  const segs = Array.from(stage.querySelectorAll(".seg"));
  segs.forEach((btn, i) => {
    btn.addEventListener("click", () => { app.tradeView = btn.dataset.view; renderTrade(stage); stage.querySelector(`#seg-${app.tradeView}`).focus(); });
    btn.addEventListener("keydown", (e) => {
      const map = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: segs.length - 1 };
      if (!(e.key in map)) return;
      e.preventDefault();
      const next = segs[(map[e.key] + segs.length) % segs.length];
      app.tradeView = next.dataset.view;
      renderTrade(stage);
      stage.querySelector(`#seg-${app.tradeView}`).focus();
    });
  });
  const out = document.getElementById("tradeOut");
  if (app.tradeView === "browse") paintBrowse(out);
  else paintWire(out);
}

async function paintBrowse(out){
  const seq = ++paintSeq;
  out.innerHTML = `<p class="count-note">Loading tradeable binders…</p>`;
  let tradeBinders;
  try{
    tradeBinders = await api("/trade/binders");
  }catch(err){
    if (seq === paintSeq) stageFailed(out, err);
    return;
  }
  if (seq !== paintSeq) return;

  if (tradeBinders.length === 0){
    out.innerHTML = `<div class="blank"><h3>Nothing on offer</h3><p>No other trainer has a tradeable binder with Pokémon in it yet. When someone marks one tradeable, it shows up here.</p></div>`;
    return;
  }

  // Group by owner for display.
  const groups = new Map();
  for (const b of tradeBinders){
    if (!groups.has(b.owner.id)) groups.set(b.owner.id, { owner: b.owner, binders: [] });
    groups.get(b.owner.id).binders.push(b);
  }

  out.innerHTML = Array.from(groups.values()).map(g => `
    <section class="trader" aria-labelledby="tr-${g.owner.id}">
      <div class="trader-top">
        <div>
          <p class="eyebrow">Trainer</p>
          <h3 id="tr-${g.owner.id}">${esc(g.owner.display_name)}</h3>
        </div>
        <button class="btn btn--sm" data-open-wire="${g.owner.id}" aria-label="Message ${esc(g.owner.display_name)}">Message</button>
      </div>
      <ul class="trader-shelf">
        ${g.binders.map(b => `
          <li class="shelf-row">
            <div>
              <div class="s-name">${esc(b.name)}</div>
              <div class="s-sub">${b.pokemon.length} ${plural(b.pokemon.length, "entry", "entries")} · ${b.pokemon.filter(p => p.shiny).length} shiny</div>
            </div>
            <button class="btn btn--sm" data-ask="${g.owner.id}|${b.id}"
              aria-label="Ask ${esc(g.owner.display_name)} about ${esc(b.name)}">Ask about this</button>
          </li>
        `).join("")}
      </ul>
    </section>
  `).join("");

  out.querySelectorAll("[data-open-wire]").forEach(btn => {
    btn.addEventListener("click", () => startWire(Number(btn.dataset.openWire), null));
  });
  out.querySelectorAll("[data-ask]").forEach(btn => {
    btn.addEventListener("click", () => {
      const [ownerId, binderId] = btn.dataset.ask.split("|").map(Number);
      const g = groups.get(ownerId);
      const binder = g?.binders.find(b => b.id === binderId);
      if (!binder) return;
      startWire(ownerId, {
        name: binder.name,
        count: binder.pokemon.length,
        art: binder.pokemon.find(p => p.art)?.art || null
      });
    });
  });
}

function startWire(peerId, clip){
  app.wireWith = peerId;
  app.draftClip = clip;
  app.tradeView = "wire";
  renderTrade(document.getElementById("stage"));
}

async function paintWire(out){
  const seq = ++paintSeq;
  out.innerHTML = `<p class="count-note">Loading conversations…</p>`;
  let convs, others;
  try{
    [convs, others] = await Promise.all([api("/conversations"), api("/accounts")]);
  }catch(err){
    if (seq === paintSeq) stageFailed(out, err);
    return;
  }
  if (seq !== paintSeq) return;

  if (others.length === 0){
    out.innerHTML = `<div class="blank"><h3>Nobody to message</h3><p>You're the only trainer registered on this server so far. When someone else creates an account, you can message them here.</p></div>`;
    return;
  }

  const started = new Set(convs.map(c => c.account.id));
  const fresh = others.filter(o => !started.has(o.id));

  out.innerHTML = `
    <div class="post">
      <div class="post-side">
        <button class="btn btn--sm" id="refreshWire" aria-label="Refresh conversations">Refresh</button>
        <nav aria-label="Conversations">
          <ul class="post-list">
            ${convs.map(c => `
              <li><button type="button" class="post-item" data-wire="${c.account.id}"
                aria-current="${app.wireWith === c.account.id}"
                aria-label="${esc(c.account.display_name)}${c.unread ? `, ${c.unread} unread` : ""}">
                <span class="pi-top">
                  <span class="pi-name">${esc(c.account.display_name)}</span>
                  ${c.unread ? `<span class="unread-pip" data-pip="${c.account.id}" aria-hidden="true">${c.unread}</span>` : ""}
                </span>
                <span class="pi-last">${esc(c.last_message || "")}</span>
              </button></li>
            `).join("")}
            ${fresh.map(o => `
              <li><button type="button" class="post-item" data-wire="${o.id}"
                aria-current="${app.wireWith === o.id}"
                aria-label="${esc(o.display_name)}, no messages yet">
                <span class="pi-top"><span class="pi-name">${esc(o.display_name)}</span></span>
                <span class="pi-last">Start a conversation</span>
              </button></li>
            `).join("")}
          </ul>
        </nav>
      </div>
      <div class="wire" id="wireBox"></div>
    </div>
  `;
  document.getElementById("refreshWire").addEventListener("click", () => paintWire(out));
  out.querySelectorAll("[data-wire]").forEach(btn => {
    btn.addEventListener("click", () => {
      app.wireWith = Number(btn.dataset.wire);
      app.draftClip = null;
      paintWire(out);
    });
  });

  paintThread(others.concat(convs.map(c => c.account)));
}

async function paintThread(known){
  const box = document.getElementById("wireBox");
  if (!box) return;

  if (!app.wireWith){
    box.innerHTML = `<p class="wire-blank">Pick a trainer to read and send messages.</p>`;
    return;
  }

  const peer = known.find(a => a.id === app.wireWith);
  const who = peer ? peer.display_name : "trainer";
  box.innerHTML = `<p class="wire-blank">Loading…</p>`;

  let msgs;
  try{
    msgs = await api(`/messages/${app.wireWith}?limit=200`);
  }catch(err){
    box.innerHTML = `<p class="wire-blank">${esc(err.message)}</p>`;
    return;
  }

  box.innerHTML = `
    <ul class="wire-log" id="wireLog" aria-label="Messages with ${esc(who)}" aria-live="polite">
      ${msgs.length === 0
        ? `<li class="wire-blank">No messages with ${esc(who)} yet. Open with what you're after.</li>`
        : msgs.map(n => {
            const mine = n.sender_id === me.id;
            const clip = n.attachment;
            const art = safeUrl(clip?.art);
            const sender = mine ? "You" : who;
            return `<li class="note ${mine ? "from-me" : "from-them"}">
              <span class="sr-only">${esc(sender)} said:</span>
              ${clip && clip.name ? `<div class="clip">
                ${art ? `<img src="${art}" alt="" loading="lazy">` : ""}
                <span class="c-txt"><strong>Binder: ${esc(clip.name)}</strong><span class="c-sub">${Number(clip.count) || 0} ${plural(Number(clip.count) || 0, "entry", "entries")}</span></span>
              </div>` : ""}
              ${n.body ? `<div class="note-body">${esc(n.body)}</div>` : ""}
              <span class="note-when">${new Date(n.created_at).toLocaleString()}</span>
            </li>`;
          }).join("")}
    </ul>
    <div id="clipDraft"></div>
    <div class="wire-desk">
      <label class="sr-only" for="wireInput">Message ${esc(who)}</label>
      <input class="txt" id="wireInput" type="text" maxlength="2000" placeholder="Message ${esc(who)}…" autocomplete="off">
      <button class="btn btn--go" id="wireSend">Send</button>
    </div>
  `;

  const log = document.getElementById("wireLog");
  log.scrollTop = log.scrollHeight;

  document.getElementById("wireSend").addEventListener("click", sendNote);
  document.getElementById("wireInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendNote();
  });
  paintClipDraft();

  // Anything they sent is now read; zero the sidebar badge in place.
  const hadUnread = msgs.some(m => m.sender_id === app.wireWith && !m.read_at);
  if (hadUnread){
    api(`/conversations/${app.wireWith}/read`, { method: "POST" })
      .then(() => document.querySelector(`[data-pip="${app.wireWith}"]`)?.remove())
      .catch(() => { /* badge clears on next refresh */ });
  }
}

function paintClipDraft(){
  const slot = document.getElementById("clipDraft");
  if (!slot) return;
  if (!app.draftClip){ slot.innerHTML = ""; return; }
  const art = safeUrl(app.draftClip.art);
  slot.innerHTML = `
    <div style="padding: 0 11px;">
      <div class="clip">
        ${art ? `<img src="${art}" alt="" loading="lazy">` : ""}
        <span class="c-txt"><strong>${esc(app.draftClip.name)}</strong><span class="c-sub">Attached to your next message</span></span>
        <button class="btn btn--sm btn--quiet" id="dropClip" aria-label="Remove ${esc(app.draftClip.name)} attachment">Remove</button>
      </div>
    </div>
  `;
  document.getElementById("dropClip").addEventListener("click", () => {
    app.draftClip = null;
    paintClipDraft();
    document.getElementById("wireInput")?.focus();
  });
}

async function sendNote(){
  const input = document.getElementById("wireInput");
  const text = input.value.trim();
  if (!text && !app.draftClip){
    alarm("Write a message or attach a binder before sending.");
    input.focus();
    return;
  }

  const btn = document.getElementById("wireSend");
  btn.disabled = true;
  try{
    await api("/messages", { method: "POST", body: {
      to: app.wireWith,
      body: text,
      attachment: app.draftClip || null
    }});
  }catch(err){
    alarm(err.message);
    btn.disabled = false;
    return;
  }
  app.draftClip = null;
  const out = document.getElementById("tradeOut");
  await paintWire(out);
  document.getElementById("wireInput")?.focus();
}

/* ══════════════════════ export / import ══════════════════════ */
const EXPORT_FORMAT = "vgc-binder-account";

async function exportBackup(){
  let roster, binders;
  try{
    [roster, binders] = await Promise.all([api("/pokemon"), api("/binders")]);
  }catch(err){ alarm(err.message); return; }

  const payload = {
    format: EXPORT_FORMAT,
    version: 2,
    exported_at: new Date().toISOString(),
    account: { username: me.username, display_name: me.display_name },
    pokemon: roster,
    binders: binders.map(b => ({
      name: b.name, description: b.description,
      tradeable: b.tradeable, pokemon_ids: b.pokemon_ids
    }))
  };
  const stamp = new Date().toISOString().slice(0, 10);
  const name = `vgc-binder-${me.username}-${stamp}.json`;
  let url;
  try{
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }catch(err){
    alarm("Export failed — this browser blocked the download.");
    return;
  }finally{
    if (url) setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
  cry(`Exported ${name} — ${roster.length} Pokémon, ${binders.length} ${plural(binders.length, "binder", "binders")}.`);
}

function pickImportFile(){
  const input = document.getElementById("importFile");
  input.value = "";
  input.click();
}

function parseLevel(v){
  const n = parseInt(v, 10);
  return Number.isInteger(n) && n >= 1 && n <= 100 ? n : null;
}
function httpsOrNull(u){
  return typeof u === "string" && u.startsWith("https://") ? u.slice(0, 300) : null;
}

/* v1 exports (the old localStorage app) used camelCase; map to API fields. */
function mapV1(p){
  return {
    species: String(p.species || "").trim().toLowerCase(),
    nickname: String(p.nickname || "").slice(0, 40),
    shiny: Boolean(p.shiny),
    mark: (p.mark && p.mark !== "None") ? String(p.mark).slice(0, 40) : "",
    ribbon: String(p.ribbon || "").slice(0, 64),
    origin_game: String(p.originGame || "").slice(0, 40),
    tera_type: String(p.teraType || "").slice(0, 20),
    ball: String(p.ball || "").slice(0, 40),
    level: parseLevel(p.level),
    nature: String(p.nature || "").slice(0, 20),
    ability: String(p.ability || "").slice(0, 40),
    ot: String(p.ot || "").slice(0, 40),
    language: String(p.language || "").slice(0, 20),
    notes: String(p.notes || "").slice(0, 2000),
    dex_id: Number.isInteger(p.dexId) ? p.dexId : null,
    art: httpsOrNull(p.art),
    art_shiny: httpsOrNull(p.artShiny)
  };
}

/* v2 exports are already API-shaped; keep only fields the API accepts. */
function mapV2(p){
  return {
    species: String(p.species || "").trim().toLowerCase(),
    nickname: String(p.nickname || "").slice(0, 40),
    shiny: Boolean(p.shiny),
    mark: String(p.mark || "").slice(0, 40),
    ribbon: String(p.ribbon || "").slice(0, 64),
    origin_game: String(p.origin_game || "").slice(0, 40),
    tera_type: String(p.tera_type || "").slice(0, 20),
    ball: String(p.ball || "").slice(0, 40),
    level: parseLevel(p.level),
    nature: String(p.nature || "").slice(0, 20),
    ability: String(p.ability || "").slice(0, 40),
    ot: String(p.ot || "").slice(0, 40),
    language: String(p.language || "").slice(0, 20),
    notes: String(p.notes || "").slice(0, 2000),
    dex_id: Number.isInteger(p.dex_id) ? p.dex_id : null,
    art: httpsOrNull(p.art),
    art_shiny: httpsOrNull(p.art_shiny)
  };
}

function handleImportFile(file){
  if (!file) return;
  const reader = new FileReader();
  reader.onerror = () => alarm("Couldn't read that file.");
  reader.onload = () => {
    let data;
    try{ data = JSON.parse(String(reader.result)); }
    catch(err){
      alarm("That file isn't valid JSON, so there's nothing to import.");
      return;
    }

    let entries = [];      // [{oldId, payload}]
    let binderSpecs = [];  // [{name, description, tradeable, oldIds}]

    if (data && data.format === EXPORT_FORMAT && Array.isArray(data.pokemon)){
      entries = data.pokemon.map(p => ({ oldId: p.id ?? null, payload: mapV2(p) }));
      binderSpecs = (data.binders || []).map(b => ({
        name: String(b.name || "Imported binder").slice(0, 60),
        description: String(b.description || "").slice(0, 500),
        tradeable: Boolean(b.tradeable),
        oldIds: Array.isArray(b.pokemon_ids) ? b.pokemon_ids : []
      }));
    } else if (data && data.format === "vgc-binder" && data.books){
      // v1 multi-trainer export: merge every trainer's book into this account.
      for (const book of Object.values(data.books)){
        for (const p of (book.roster || [])){
          entries.push({ oldId: p.id ?? null, payload: mapV1(p) });
        }
        for (const b of (book.binders || [])){
          binderSpecs.push({
            name: String(b.name || "Imported binder").slice(0, 60),
            description: String(b.description || "").slice(0, 500),
            tradeable: Boolean(b.tradeable),
            oldIds: Array.isArray(b.pokemonIds) ? b.pokemonIds : []
          });
        }
      }
    } else {
      alarm("That's not a VGC Binder export. Use a file saved by the Export button.");
      return;
    }

    entries = entries.filter(e => e.payload.species);
    if (entries.length === 0 && binderSpecs.length === 0){
      alarm("That export has nothing in it to import.");
      return;
    }
    confirmImport(entries, binderSpecs, file.name);
  };
  reader.readAsText(file);
}

function confirmImport(entries, binderSpecs, filename){
  openDialog(`
    <h2 id="dlgTitle">Import ${esc(filename)}?</h2>
    <p class="card-sub" id="dlgDesc">Everything is <strong>added</strong> to ${esc(me.display_name)}'s account — nothing you already have is touched.</p>
    <ul class="summary-list">
      <li><span class="fig">${entries.length}</span><span class="eyebrow">Pokémon</span></li>
      <li><span class="fig">${binderSpecs.length}</span><span class="eyebrow">${plural(binderSpecs.length, "Binder", "Binders")}</span></li>
    </ul>
    <div class="card-acts">
      <button class="btn btn--quiet" data-close>Cancel</button>
      <button class="btn btn--go" id="doImport">Add to my collection</button>
    </div>
  `, "card--slim");

  document.getElementById("doImport").addEventListener("click", async () => {
    const btn = document.getElementById("doImport");
    btn.disabled = true;

    const idMap = new Map();   // old export id -> new server id
    let made = 0, failed = 0;
    for (const e of entries){
      btn.textContent = `Importing ${made + failed + 1} of ${entries.length}…`;
      try{
        const row = await api("/pokemon", { method: "POST", body: e.payload });
        if (e.oldId !== null) idMap.set(e.oldId, row.id);
        made++;
      }catch(err){ failed++; }
    }

    let bindersMade = 0;
    for (const spec of binderSpecs){
      try{
        const b = await api("/binders", { method: "POST", body: {
          name: spec.name, description: spec.description, tradeable: spec.tradeable
        }});
        const ids = spec.oldIds.map(o => idMap.get(o)).filter(Boolean);
        if (ids.length){
          await api(`/binders/${b.id}/pokemon`, { method: "PUT", body: { pokemon_ids: ids } });
        }
        bindersMade++;
      }catch(err){ /* counted below by omission */ }
    }

    closeDialog();
    app.tab = "collection";
    renderTabs();
    renderStage();
    const summary = `Imported ${made} Pokémon and ${bindersMade} ${plural(bindersMade, "binder", "binders")}.`;
    if (failed) alarm(`${summary} ${failed} ${plural(failed, "entry", "entries")} couldn't be saved.`);
    else cry(summary);
  });
}

/* ══════════════════════ dialog plumbing ══════════════════════ */
let lastFocused = null;

const FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';

function openDialog(inner, extraClass){
  lastFocused = document.activeElement;
  const root = document.getElementById("dialogRoot");
  root.innerHTML = `
    <div class="scrim" id="scrim">
      <div class="card ${extraClass || ""}" role="dialog" aria-modal="true"
           aria-labelledby="dlgTitle" aria-describedby="dlgDesc">${inner}</div>
    </div>
  `;
  document.getElementById("scrim").addEventListener("mousedown", (e) => {
    if (e.target.id === "scrim") closeDialog();
  });
  root.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeDialog));
  document.addEventListener("keydown", dialogKeys, true);
}

/* Escape closes; Tab is kept inside the dialog so focus can't wander behind the scrim. */
function dialogKeys(e){
  if (e.key === "Escape"){ e.preventDefault(); closeDialog(); return; }
  if (e.key !== "Tab") return;
  const card = document.querySelector(".scrim .card");
  if (!card) return;
  const items = Array.from(card.querySelectorAll(FOCUSABLE)).filter(el => el.offsetParent !== null);
  if (items.length === 0) return;
  const first = items[0], last = items[items.length - 1];
  if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  else if (!card.contains(document.activeElement)){ e.preventDefault(); first.focus(); }
}

function closeDialog(){
  document.getElementById("dialogRoot").innerHTML = "";
  document.removeEventListener("keydown", dialogKeys, true);
  if (lastFocused && document.contains(lastFocused)) lastFocused.focus();
  lastFocused = null;
}

function askConfirm({ title, body, go, onGo }){
  openDialog(`
    <h2 id="dlgTitle">${esc(title)}</h2>
    <p class="card-sub" id="dlgDesc">${esc(body)}</p>
    <div class="card-acts">
      <button class="btn btn--quiet" data-close>Keep it</button>
      <button class="btn btn--go" id="confirmGo">${esc(go)}</button>
    </div>
  `, "card--slim");
  const btn = document.getElementById("confirmGo");
  btn.focus();
  btn.addEventListener("click", () => { closeDialog(); onGo(); });
}

/* ══════════════════════ boot ══════════════════════ */
document.getElementById("importFile").addEventListener("change", (e) => {
  handleImportFile(e.target.files && e.target.files[0]);
});

async function boot(){
  if (storedRefresh() && await tryRefresh()){
    try{
      me = await api("/me");
      enterApp();
      return;
    }catch(err){ /* fall through to the gate */ }
  }
  enterGate();
}
boot();
